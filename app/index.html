<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ByAdBlock">
<title>ByAdBlock</title>
<script>
/* tema antes de pintar nada: 'light', 'dark' o 'auto' */
(function () {
  var t = 'auto'; try { t = JSON.parse(localStorage.getItem('byab_theme')) || 'auto'; } catch (e) {}
  var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://www.googleapis.com">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
<script src="config.js"></script>
<script>if (/[?&]mock\b/.test(location.search)) document.write('<script src="../test/app-mock.js"><\/script>');</script>
</head>
<body>
<div id="root">
  <header id="top">
    <a id="logo" href="#/" title="Inicio">
      <img src="icons/icon-192.png" alt=""><span>ByAdBlock</span>
    </a>
    <form id="sbox" role="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="q" type="search" placeholder="Buscar vídeos y canales" autocomplete="off" spellcheck="false" enterkeyhint="search">
    </form>
    <div id="acts">
      <button class="ib" id="bTheme" type="button" title="Modo claro / oscuro"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      <button class="ib" id="bAccount" type="button" title="Tu cuenta"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
      <button class="ib" id="bMenu" type="button" title="Más"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </header>

  <main id="page" hidden></main>

  <main id="watch" hidden>
    <div id="stage">
      <div id="pcol">
        <div id="pwrap"><div id="pbox"><div id="player"></div></div></div>
        <div id="vinfo">
          <h1 id="vtitle"></h1>
          <div id="vrow">
            <a id="chan" href="#/">
              <span id="avatar"></span>
              <div><div id="vchan"></div><div id="vsub"></div></div>
            </a>
            <button class="follow" id="bFollow" type="button"></button>
            <span class="sp"></span>
            <button class="pill" id="bShare" type="button" title="Copiar enlace"><svg viewBox="0 0 24 24"><path d="M14 5l6 6-6 6M20 11H9a5 5 0 0 0-5 5v3"/></svg><span>Compartir</span></button>
            <a class="pill" id="bYt" target="_blank" rel="noopener" title="Abrir en YouTube"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>YouTube</span></a>
          </div>
          <div id="vbox"></div>
        </div>
      </div>
      <aside id="side"></aside>
    </div>
  </main>
</div>

<div id="sheet" hidden></div>
<div id="toast"></div>

<script type="module" src="app.js"></script>
</body>
</html>
